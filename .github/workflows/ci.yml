name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    # termit targets macOS. The renderer, the clipboard bridge and the
    # keyboard handling all assume it, so there is nothing to gain from
    # building on another platform yet.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        # Some tests spawn a real pty and drive /bin/zsh, so they need a
        # tty-capable runner. GitHub's macOS images provide one.
        run: cargo test --all-targets

      - name: Build release
        run: cargo build --release

      - name: Smoke test the binaries
        run: |
          ./target/release/termit --shell-integration | head -3
          ./target/release/termit --latency-test

  audit:
    # Security advisories against the lockfile. This one runs on Linux:
    # it only reads Cargo.lock, nothing here is macOS-specific, and the
    # Linux runner is the cheaper of the two.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit the dependencies
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Neither of these has a fix this repository can reach, so
          # they are named here rather than left to fail every run.
          #
          # RUSTSEC-2026-0253 (lru, unsound): fixed in 0.18.2, but
          # glyphon pins lru to 0.16. The advisory needs a key whose
          # Drop panics; glyphon's key is a Copy enum, which cannot
          # implement Drop, so the path does not exist here.
          #
          # RUSTSEC-2026-0192 (ttf-parser, unmaintained): arrives
          # through cosmic-text and fontdb, and has no patched release
          # at all.
          #
          # Drop an entry when the crate above it moves.
          ignore: RUSTSEC-2026-0253,RUSTSEC-2026-0192
