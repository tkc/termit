name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    # termit targets macOS. The renderer, the clipboard bridge and the
    # keyboard handling all assume it, so there is nothing to gain from
    # building on another platform yet.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        # Some tests spawn a real pty and drive /bin/zsh, so they need a
        # tty-capable runner. GitHub's macOS images provide one.
        run: cargo test --all-targets

      - name: Build release
        run: cargo build --release

      - name: Smoke test the binaries
        run: |
          ./target/release/termit --shell-integration | head -3
          ./target/release/termit --latency-test
