[package]
name = "termit"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "エージェント向けの軽量ターミナル"

[dependencies]
# 普通の文字のあいだを飛ばすため。OSC の走査に使う。
memchr = "2"
# 貼り付けで伏せる場所を指す式に使う。env_logger が既に連れてきているので、
# 直接使っても組み立ての費用は増えない。後戻りしない実装なので、
# 利用者の書いた式で端末が固まることがない。
regex = "1"
alacritty_terminal = "0.26"
portable-pty = "0.9"
libc = "0.2"
winit = "0.30"
wgpu = "30"
glyphon = "0.12"
serde = { version = "1", features = ["derive"] }
toml = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
dirs = "6"
log = "0.4"
env_logger = "0.11"
pollster = "0.4"
unicode-width = "0.2"
bytemuck = { version = "1", features = ["derive"] }
# 字形の表を引くための速い雑ぱなハッシュ。glyphon が同じものを使っている。
rustc-hash = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# release と同じ最適化で、記号だけ残す。`sample` で中身を見るために使う。
[profile.profiling]
inherits = "release"
strip = false
debug = 1
